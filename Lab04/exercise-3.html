<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
        <title>Form</title>
    </head>
    <body>
        <div class="container">
            <div
                class="form-wrapped d-flex min-vh-100 align-items-center justify-content-center"
            >
                <form action="#" class="border border-dark p-5 rounded">
                    <!-- Row 1 -->
                    <div class="row">
                        <div
                            class="col-12 col-lg-6 form-group d-flex flex-column"
                        >
                            <label for="firstName">First name</label>
                            <input
                                type="text"
                                name="firstName"
                                id="firstName"
                                class="form-control"
                                placeholder="First name"
                            />
                        </div>
                        <div
                            class="col-12 col-lg-6 form-group d-flex flex-column"
                        >
                            <label for="lastName">Last name</label>
                            <input
                                type="text"
                                name="lastName"
                                id="lastName"
                                class="form-control"
                                placeholder="Last name"
                            />
                        </div>
                    </div>

                    <!-- Row 2 -->
                    <div class="row">
                        <div class="col-12 form-group d-flex flex-column">
                            <label for="user">Username</label>
                            <input
                                type="text"
                                name="user"
                                id="user"
                                class="form-control"
                                placeholder="Username"
                            />
                        </div>
                        <div class="col-12 form-group d-flex flex-column">
                            <label for="password">Password</label>
                            <input
                                type="password"
                                name="password"
                                id="password"
                                class="form-control"
                                placeholder="Password"
                            />
                        </div>
                    </div>

                    <!-- Row 3-->
                    <div class="row">
                        <div class="col-12 form-group d-flex flex-column">
                            <label for="male">Gender</label>
                            <div class="d-flex">
                                <div class="custom-control custom-radio">
                                    <input
                                        type="radio"
                                        id="male"
                                        name="gender"
                                        value="male"
                                        class="custom-control-input"
                                    />
                                    <label
                                        class="custom-control-label pr-4"
                                        for="male"
                                        >Male</label
                                    >
                                </div>
                                <div class="custom-control custom-radio">
                                    <input
                                        type="radio"
                                        id="female"
                                        name="gender"
                                        value="female"
                                        class="custom-control-input"
                                    />
                                    <label
                                        class="custom-control-label"
                                        for="female"
                                        >Female</label
                                    >
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Row 4 -->
                    <div class="row">
                        <div class="col-12 form-group d-flex flex-column">
                            <label for="country">Country</label>
                            <select
                                name="country"
                                id="country"
                                class="custom-select"
                            >
                                <option value="Vietnam">Vietnam</option>
                                <option value="Thailand">Thailand</option>
                                <option value="USA">USA</option>
                                <option value="China">China</option>
                            </select>
                        </div>
                    </div>

                    <!-- Row 5-->
                    <div class="row">
                        <div class="col-12 form-group custom-control custom-checkbox">
                            <input
                                type="checkbox"
                                class="custom-control-input"
                                id="customCheck1"
                                value="remember"
                            />
                            <label
                                class="custom-control-label user-select-none"
                                for="customCheck1"
                                >Remember me</label
                            >
                        </div>
                    </div>

                    <!-- Row 6-->
                    <div class="row mt-3">
                        <div
                            class="btn-group w-50"
                            role="group"
                            aria-label="Basic example"
                        >
                            <button type="submit" class="btn btn-success mr-3 rounded">
                                Login
                            </button>
                            <button
                                type="reset"
                                class="btn btn-outline-success rounded"
                            >
                                Reset
                            </button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </body>
</html>
