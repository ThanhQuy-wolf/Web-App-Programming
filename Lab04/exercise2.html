<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link
            rel="stylesheet"
            href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
        />
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        />
        <title>Login page</title>
    </head>
    <body>
        <div
            class="container min-vh-100 d-flex justify-content-center align-items-center"
        >
            <form class="row flex-column align-items-center w-100">
                <div class="form-group col-6 p-0">
                    <label for="user">Username</label>
                    <div class="input-group flex-nowrap">
                        <div class="input-group-prepend">
                            <span
                                class="bi bi-person-circle input-group-text"
                                id="addon-username"
                            ></span>
                        </div>
                        <input
                            type="text"
                            class="form-control"
                            placeholder="Username"
                            aria-label="Username"
                            aria-describedby="addon-username"
                            id="user"
                            name="username"
                        />
                    </div>
                </div>
                <div class="form-group col-6 p-0">
                    <label for="password">Password</label>
                    <div class="input-group flex-nowrap">
                        <div class="input-group-prepend">
                            <span
                                class="bi bi-unlock2-fill input-group-text"
                                id="addon-password"
                            ></span>
                        </div>
                        <input
                            type="password"
                            class="form-control"
                            placeholder="Password"
                            aria-label="Password"
                            aria-describedby="addon-password"
                            id="password"
                            name="password"
                        />
                    </div>
                </div>
                <div class="form-group form-check col-6">
                    <input type="checkbox" class="form-check-input" id="exampleCheck1" />
                    <label class="form-check-label" for="exampleCheck1"
                        >Remember me</label
                    >
                </div>
                <div class="form-group col-6 p-0">
                    <button type="submit" class="btn btn-success col-12 col-sm-auto">Login</button>
                </div>
            </form>
        </div>
    </body>
</html>
