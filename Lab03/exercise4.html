<!doctype html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta charset="UTF-8" />
        <title>Table</title>
    </head>
    <body>
        <style>
            * {
                box-sizing: border-box;
            }

            select {
                float: left;
            }
            img {
                float: left;
            }
        </style>

        <select id="imageList" name="imageList" size="10">
            <option value="pic_001.jpg">pic_001.jpg</option>
            <option value="pic_002.jpg">pic_002.jpg</option>
            <option value="pic_003.jpg">pic_003.jpg</option>
            <option value="pic_004.jpg">pic_004.jpg</option>
            <option value="pic_005.jpg">pic_005.jpg</option>
            <option value="pic_006.jpg">pic_006.jpg</option>
            <option value="pic_007.jpg">pic_007.jpg</option>
            <option value="pic_008.jpg">pic_008.jpg</option>
            <option value="pic_009.jpg">pic_009.jpg</option>
            <option value="pic_010.jpg">pic_010.jpg</option>
        </select>
        <img src="./images/pic_001.jpg" alt="" />
        <button type="button" onclick="clickBack()">Back</button>
        <button type="button" onclick="clickSlideShow()" id="toggleBtn">
            Start slideshow
        </button>
        <button type="button" onclick="clickNext()">Next</button>
        <p>pic_001.jpg (10/55)</p>

        <script>
            const select = document.getElementById("imageList");
            let currentIndex = select.selectedIndex !== -1 ? select.selectedIndex : 0;
            const totalImages = select.options.length;
            const img = document.querySelector("img");
            const desc = document.querySelector("p");
            const toggleBtn = document.getElementById("toggleBtn");
            let timerId = null;

            function clickNext() {
                currentIndex = currentIndex < totalImages - 1 ? currentIndex + 1 : 0;
                let imageFile = select.options[currentIndex].value;

                img.src = `./images/${imageFile}`;
                desc.innerText = `${imageFile} (10/55)`;
            }

            function clickBack() {
                currentIndex = currentIndex > 0 ? currentIndex - 1 : totalImages - 1;
                let imageFile = select.options[currentIndex].value;

                img.src = `./images/${imageFile}`;
                desc.innerText = `${imageFile} (10/55)`;
            }

            function clickSlideShow() {
                if (timerId === null) {
                    timerId = setInterval(() => {
                        currentIndex =
                            currentIndex < totalImages - 1 ? currentIndex + 1 : 0;
                        let imageFile = select.options[currentIndex].value;
                        img.src = `./images/${imageFile}`;
                    }, 1000);

                    toggleBtn.innerText = "Stop slideshow";
                } else {
                    clearInterval(timerId);
                    timerId = null;

                    toggleBtn.innerText = "Start slideshow";
                }
            }
        </script>
    </body>
</html>
